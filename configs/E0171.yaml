exp_id: E0171
slug: B2_lgb_raw
hypothesis: 'B2: LightGBM referensi (Lampiran H, lr 0.1 screening) tanpa ID spasial
  [CV primary]'
phase: 2
targets:
- t1
- t2
- t3
- t4
- t5
seeds:
- 42
target_transform:
  default:
    type: identity
cv:
  scheme: primary
  fold_file: data/folds/folds_primary_k5_s42.parquet
features:
  set: raw
model:
  family: lgb
  device: cpu
  params:
    objective: regression
    learning_rate: 0.1
    num_leaves: 255
    min_data_in_leaf: 100
    feature_fraction: 0.6
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    max_bin: 255
    n_estimators: 5000
    early_stopping_rounds: 300
    num_threads: 6
notes: n_estimators dibatasi 5000 (lr 0.1) agar baseline tidak memblokir antrean
