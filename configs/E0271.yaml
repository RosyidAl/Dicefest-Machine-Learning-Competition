exp_id: E0271-E0278
slug: cv_secondary_check
hypothesis: 'V02 CV_SECONDARY: LightGBM screening (lr 0.1) gpm dan epm, dengan/tanpa TE spasial, dinilai di CV_PRIMARY
  (KFold per baris, meniru test) dan CV_SECONDARY (GroupKFold per zone_region_id). Mengukur seberapa besar skor bergantung
  pada wilayah yang terlihat di train.'
phase: 2
script: src/exp_cv_secondary.py
targets: [t1, t2, t3]
cv:
  primary: data/folds/folds_primary_k5_s42.parquet
  secondary: data/folds/folds_secondary_k5_s42.parquet
features: legacy + agg (+ te subzone/zone/window 2,10/cells)
model:
  family: lgb
  device: cpu
  params: {objective: regression, learning_rate: 0.1, num_leaves: 255, min_data_in_leaf: 100, feature_fraction: 0.5,
           bagging_fraction: 0.8, bagging_freq: 1, lambda_l2: 10.0, max_bin: 255, num_threads: 12}
weights: {gpm: M^2/A, epm: M^2}
outputs: exp/cv2/results.jsonl
