exp_id: E0265
parent_id: E0190
slug: T5P_xgb_poisson_eui
hypothesis: 'Poisson XGB pada EUI (laju per luas, bobot A = Poisson gas dengan offset log A), mcw setara 50 baris; vs E0190'
features:
  set: legacy
  blocks:
  - agg
  - te
phase: 3
targets:
- t1
derive_eui: true
seeds:
- 42
target_transform:
  default:
    type: ratio
    exposure_col: bld_dim_06
