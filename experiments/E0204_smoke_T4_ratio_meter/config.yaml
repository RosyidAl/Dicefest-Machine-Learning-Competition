exp_id: E0204
slug: T4_ratio_meter
hypothesis: 'T4 rasio per meter (bld_dim_12) dengan bobot E^2 untuk t1 dan t2; t3
  via EUI identity [screening: LGB lr 0.1, 3 fold]'
targets:
- t1
- t2
target_transform:
  default:
    type: ratio
    exposure_col: bld_dim_12
    weight_power: 2
model:
  family: lgb
  device: cpu
  params:
    objective: regression
    learning_rate: 0.1
    num_leaves: 255
    min_data_in_leaf: 100
    feature_fraction: 0.5
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 10.0
    max_bin: 255
    n_estimators: 20000
    early_stopping_rounds: 200
    num_threads: 8
phase: 3
seeds:
- 42
cv:
  scheme: primary
  fold_file: data/folds/folds_primary_k5_s42.parquet
  screen_folds: 3
features:
  set: legacy
  blocks:
  - agg
  - te
parent_id: E0200
