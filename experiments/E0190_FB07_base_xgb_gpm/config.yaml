exp_id: E0190
slug: FB07_base_xgb_gpm
hypothesis: 'Acuan FB07: XGB gpm (x4 params) FS_legacy + agg + TE, 5-fold'
features:
  set: legacy
  blocks:
  - agg
  - te
phase: 4
targets:
- t1
derive_eui: true
seeds:
- 42
target_transform:
  default:
    type: ratio
    exposure_col: bld_dim_12
    weight_power: 2
    weight_col: bld_dim_06
    weight_col_power: -1
cv:
  scheme: primary
  fold_file: data/folds/folds_primary_k5_s42.parquet
model:
  family: xgb
  device: gpu
  params:
    learning_rate: 0.05
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.6
    min_child_weight: 50
    reg_lambda: 1.0
    eval_metric: rmse
    n_estimators: 20000
    early_stopping_rounds: 200
